spring.application.name=beAn
server.port=${PORT:8080}

# ===================================================================
# MongoDB Persistent Cloud / Local Database Configuration
# ===================================================================
# Priority 1: SPRING_DATA_MONGODB_URI (e.g. from Render Environment Variables)
# Priority 2: MONGODB_URI (Common naming convention on Cloud PaaS)
# Priority 3: mongodb://localhost:27017/beandb (Local development)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/beandb}}

# Embedded H2 Database (Kept for JPA compatibility)
spring.datasource.url=jdbc:h2:mem:beandb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
