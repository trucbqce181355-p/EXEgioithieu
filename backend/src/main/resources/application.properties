spring.application.name=beAn
server.port=${PORT:8080}

# ===================================================================
# MongoDB Persistent Cloud / Local Database Configuration
# ===================================================================
# In production on Render: Uses SPRING_DATA_MONGODB_URI or MONGODB_URI
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:}}
spring.data.mongodb.database=beandb

# Embedded H2 Database (Kept for JPA compatibility)
spring.datasource.url=jdbc:h2:mem:beandb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
